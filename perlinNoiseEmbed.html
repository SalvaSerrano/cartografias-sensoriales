<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Nube</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Aquí puedes añadir más CSS si quieres personalizar la web */
  </style>
</head>

<body>
  <script>
    let sliderNoiseScale, sliderBrightness, sliderZ, sliderBlockSize;
    let sliderRectW, sliderRectH, sliderRadius, sliderAlpha;
    let colorPicker, btnSave, checkCircle;
    const sidebarWidth = 260;

    function setup() {
      let canvas = createCanvas(windowWidth - sidebarWidth, windowHeight);
      canvas.position(sidebarWidth, 0);
      pixelDensity(1);

      // --- ESTILOS CSS ---
      createElement('style', `
            body { margin: 0; overflow: hidden; background: #fff; }
            .sidebar { 
              width: ${sidebarWidth}px; height: 100vh; background: #f4f4f9; 
              position: fixed; left: 0; top: 0; padding: 20px; 
              box-sizing: border-box; border-right: 1px solid #ddd;
              overflow-y: auto; z-index: 100; font-family: Arial, sans-serif;
            }
            .control-group { margin-bottom: 20px; border-bottom: 1px solid #e0e0e0; padding-bottom: 10px; }
            .label-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
            .label-title { font-size: 11px; font-weight: bold; color: #333; text-transform: uppercase; }
            .current-val-input { width: 50px; font-size: 12px; color: #df93f0; font-weight: bold; text-align: center; border-radius: 4px; border: 1px solid #ddd; padding: 2px; }
            .slider-container { display: flex; align-items: center; gap: 8px; }
            .limit-val { font-size: 10px; color: #888; width: 30px; text-align: center; }
            input[type=range] { flex-grow: 1; -webkit-appearance: none; background: #ddd; height: 4px; border-radius: 2px; }
            input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #df93f0; cursor: pointer; border: 2px solid #fff; }
            button { width: 100%; background: #df93f0; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
            button:hover { background: #c07cd1; }
          `);

      let sidebar = createDiv().class('sidebar');

      // Sliders
      sliderNoiseScale = createEditableSlider(sidebar, "Zoom Ruido", 1, 200, 50);
      sliderZ = createEditableSlider(sidebar, "Evolución (Z)", 0, 1000, 0);
      sliderBlockSize = createEditableSlider(sidebar, "Tamaño Grano", 1, 20, 4);
      sliderBrightness = createEditableSlider(sidebar, "Contraste", 1, 5, 1);
      sliderRectW = createEditableSlider(sidebar, "Ancho Área", 50, 500, 400);
      sliderRectH = createEditableSlider(sidebar, "Alto Área", 50, 500, 400);
      sliderRadius = createEditableSlider(sidebar, "Radio Círculo", 20, 500, 200);

      let checkDiv = createDiv().parent(sidebar).class('control-group');
      checkCircle = createCheckbox(' Limitar por Círculo', false).parent(checkDiv).style('font-size', '12px');

      sliderAlpha = createEditableSlider(sidebar, "Opacidad", 0, 255, 255);
      let colorGroup = createDiv().parent(sidebar).class('control-group');
      createDiv("Color Base").parent(colorGroup).class('label-title');
      colorPicker = createColorPicker('#df93f0').parent(colorGroup).style('width', '100%').style('height', '30px');

      btnSave = createButton('DESCARGAR PNG').parent(sidebar);
      btnSave.mousePressed(downloadCroppedImage);
    }

    function draw() {
      clear();
      renderNoise(this); // Dibujar en el lienzo principal
    }

    // Función centralizada de renderizado para poder usarla en el lienzo y en el archivo
    function renderNoise(targetGraphics, isExport = false) {
      let scale = sliderNoiseScale.value() / 1000;
      let zOff = sliderZ.value() / 100;
      let blockSize = sliderBlockSize.value();
      let brightnessMult = sliderBrightness.value();
      let col = colorPicker.color();
      let alphaVal = sliderAlpha.value();

      let rw = sliderRectW.value();
      let rh = sliderRectH.value();

      // Si es exportación, dibujamos desde (0,0). Si es pantalla, centramos.
      let rx = isExport ? 10 : (width - rw) / 2;
      let ry = isExport ? 10 : (height - rh) / 2;

      let radius = sliderRadius.value();
      let radiusSq = pow(radius, 2);
      let centerX = isExport ? radius + 10 : width / 2;
      let centerY = isExport ? radius + 10 : height / 2;

      targetGraphics.noStroke();

      for (let x = rx; x < rx + rw; x += blockSize) {
        for (let y = ry; y < ry + rh; y += blockSize) {
          if (checkCircle.checked()) {
            let dSq = pow(x - centerX, 2) + pow(y - centerY, 2);
            if (dSq > radiusSq) continue;
          }
          let noiseVal = noise(x * scale, y * scale, zOff);
          noiseVal = constrain(noiseVal * brightnessMult, 0, 1);
          targetGraphics.fill(red(col), green(col), blue(col), noiseVal * alphaVal);
          targetGraphics.rect(x, y, blockSize, blockSize);
        }
      }
    }

    function downloadCroppedImage() {
      let margin = 20;
      let outW, outH;

      // Determinar tamaño según si el círculo está activo o no
      if (checkCircle.checked()) {
        outW = sliderRadius.value() * 2 + margin;
        outH = sliderRadius.value() * 2 + margin;
      } else {
        outW = sliderRectW.value() + margin;
        outH = sliderRectH.value() + margin;
      }

      // Crear un buffer con el tamaño exacto
      let pg = createGraphics(outW, outH);
      pg.clear();

      // Dibujar el ruido en el buffer (isExport = true para resetear coordenadas)
      renderNoise(pg, true);

      save(pg, 'ruido', 'png');
    }

    function createEditableSlider(parent, labelText, minV, maxV, defaultV) {
      let group = createDiv().parent(parent).class('control-group');
      let header = createDiv().parent(group).class('label-header');
      createSpan(labelText).parent(header).class('label-title');
      let valInput = createInput(defaultV.toString()).parent(header).class('current-val-input');
      let sliderRow = createDiv().parent(group).class('slider-container');
      createSpan(minV).parent(sliderRow).class('limit-val');
      let s = createSlider(minV, maxV, defaultV).parent(sliderRow);
      createSpan(maxV).parent(sliderRow).class('limit-val');
      s.input(() => valInput.value(s.value()));
      valInput.changed(() => {
        let v = constrain(parseInt(valInput.value()) || minV, minV, maxV);
        valInput.value(v);
        s.value(v);
      });
      return s;
    }

    function windowResized() {
      resizeCanvas(windowWidth - sidebarWidth, windowHeight);
    }           
  </script>
</body>

</html>
